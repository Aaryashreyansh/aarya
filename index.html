
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AARYA AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b1020;color:#f4f6ff;
  font-family:system-ui,Arial,sans-serif;
  min-height:100vh;padding:20px
}
header{max-width:700px;margin:auto}
.logo{color:#a8baff;font-size:25px;font-weight:800}
.tag{color:#9ba8c1;font-size:13px}
main{max-width:700px;margin:65px auto 0}
h1{font-size:38px;line-height:1.15}
h1 span{color:#91aaff}
p{color:#aab6cc}
.card{
  border:1px solid #293650;background:#121b2e;
  border-radius:16px;padding:16px;margin-top:25px
}
textarea{
  width:100%;min-height:100px;resize:vertical;
  background:#0b1020;color:white;border:1px solid #34415d;
  border-radius:10px;padding:13px;font:inherit
}
button{
  background:#91aaff;color:#0b1020;border:0;
  padding:12px 20px;border-radius:10px;
  font-weight:700;margin-top:12px
}
#answer{white-space:pre-wrap;overflow-wrap:anywhere}
footer{text-align:center;color:#77849d;font-size:12px;margin-top:25px}
</style>
</head>
<body>
<header>
  <div class="logo">✳ AARYA AI</div>
  <div class="tag">YOUR PERSONAL AI WORKSPACE</div>
</header>
<main>
  <p>WELCOME TO YOUR AI</p>
  <h1>Think freely.<br><span>Build anything.</span></h1>
  <p>Your personal space for AI, research and coding.</p>
  <section class="card">
    <h3>💬 AI Chat</h3>
    <textarea id="question" placeholder="Ask AARYA AI anything..."></textarea>
    <button onclick="askAI()">Send ↑</button>
    <div id="answer"></div>
  </section>
  <footer>
    AARYA AI · Built with curiosity 🚀
  </footer>
</main>
<script>
const WORKER_URL = "https://aarya-ai-backend.aaryashreyansh618.workers.dev/";

async function askAI() {
  const question = document.getElementById("question");
  const answer = document.getElementById("answer");
  let message = question.value.trim();

  if (!message) {
    answer.textContent = "पहले अपना सवाल लिखो।";
    return;
  }

  let mode = "chat";

  if (message.toLowerCase().startsWith("/research ")) {
    mode = "research";
    message = message.slice(10).trim();
  } else if (message.toLowerCase().startsWith("/code ")) {
    mode = "code";
    message = message.slice(6).trim();
  }

  answer.textContent = "🤖 AARYA AI जवाब तैयार कर रहा है...";

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        mode: mode
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    answer.textContent = data.answer || "कोई जवाब नहीं मिला।";
  } catch (error) {
    answer.textContent =
      "कनेक्शन में समस्या हुई: " + error.message;
  }
}
</script>
<!-- AARYA AI: Extra Tools -->
<div id="aarya-tools" style="margin:16px 0;display:flex;gap:8px;flex-wrap:wrap">
  <button type="button" id="aarya-copy">📋 Copy Answer</button>
  <button type="button" id="aarya-speak">🔊 सुनें</button>
  <button type="button" id="aarya-mic">🎙️ बोलकर पूछें</button>
  <button type="button" id="aarya-pdf-btn">📄 PDF चुनें</button>
  <input id="aarya-pdf" type="file" accept="application/pdf" hidden>
</div>

<p id="aarya-status" aria-live="polite"></p>

<script>
(() => {
  const question = document.getElementById("question");
  const answer = document.getElementById("answer");
  const status = document.getElementById("aarya-status");

  if (!question || !answer) {
    status.textContent =
      "Chat input नहीं मिला। मौजूदा question और answer IDs जाँचें।";
    return;
  }

  document.getElementById("aarya-copy").onclick = async () => {
    try {
      await navigator.clipboard.writeText(answer.innerText);
      status.textContent = "जवाब कॉपी हो गया!";
    } catch {
      status.textContent =
        "Copy नहीं हुआ। जवाब को long-press करके कॉपी करो।";
    }
  };

  document.getElementById("aarya-speak").onclick = () => {
    if (!("speechSynthesis" in window)) {
      status.textContent = "इस ब्राउज़र में आवाज़ का सपोर्ट नहीं है।";
      return;
    }

    speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(answer.innerText);
    speech.lang = /[\u0900-\u097F]/.test(answer.innerText)
      ? "hi-IN" : "en-IN";
    speechSynthesis.speak(speech);
  };

  document.getElementById("aarya-mic").onclick = () => {
    const Recognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Recognition) {
      status.textContent =
        "Voice Input उपलब्ध नहीं है। Chrome में कोशिश करो।";
      return;
    }

    const recognition = new Recognition();
    recognition.lang = "hi-IN";
    recognition.interimResults = false;

    recognition.onstart = () => {
      status.textContent = "सुन रहा हूँ... अब बोलो।";
    };

    recognition.onresult = event => {
      question.value = event.results[0][0].transcript;
      status.textContent =
        "सवाल लिख दिया गया है। अब Send दबाओ।";
    };

    recognition.onerror = () => {
      status.textContent =
        "माइक काम नहीं किया। Microphone permission जाँचो।";
    };

    recognition.start();
  };

  document.getElementById("aarya-pdf-btn").onclick = () => {
    document.getElementById("aarya-pdf").click();
  };

  document.getElementById("aarya-pdf").onchange = async event => {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
      status.textContent = "अभी 5 MB से छोटी PDF चुनो।";
      return;
    }

    status.textContent = "PDF पढ़ने की तैयारी हो रही है...";

    try {
      if (!window.pdfjsLib) {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });

        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }

      const bytes = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      let text = "";

      const pages = Math.min(pdf.numPages, 10);

      for (let pageNo = 1; pageNo <= pages; pageNo++) {
        const page = await pdf.getPage(pageNo);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }

      if (!text.trim()) {
        status.textContent =
          "PDF में selectable text नहीं मिला। यह scanned PDF हो सकती है।";
        return;
      }

      question.value =
        "इस PDF को हिंदी में समझाओ और मुख्य बिंदु बताओ:\n\n" +
        text.slice(0, 10000);

      status.textContent =
        "PDF का टेक्स्ट तैयार है। अब Send दबाकर सवाल पूछो।";
    } catch {
      status.textContent =
        "PDF नहीं पढ़ी जा सकी। दूसरी PDF से कोशिश करो।";
    }
  };
})();
</script>
  
</body>
</html>
